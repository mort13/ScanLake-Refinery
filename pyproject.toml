[project]
name = "scanlake-refinery"
version = "0.1.0"
description = "Periodic sync, consolidation and analysis worker for ScanLake scan data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "httpx>=0.28",
]

[project.scripts]
refinery = "scanlake_refinery.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanlake_refinery"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
