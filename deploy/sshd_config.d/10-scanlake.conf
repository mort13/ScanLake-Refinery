# Installed by ScanLake Refinery deploy/bootstrap-lxc.sh: key-only SSH for one admin, LAN only.
# __ADMIN__ and __LAN_PATTERN__ are filled in by the script.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers __ADMIN__@__LAN_PATTERN__
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
